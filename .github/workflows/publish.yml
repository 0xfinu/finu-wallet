name: Publish to GitHub Packages

# Publishes @0xfinu/finu-wallet to GitHub Packages (npm) when a release is created.
# Uses the built-in GITHUB_TOKEN — no secret to configure.
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@0xfinu"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
